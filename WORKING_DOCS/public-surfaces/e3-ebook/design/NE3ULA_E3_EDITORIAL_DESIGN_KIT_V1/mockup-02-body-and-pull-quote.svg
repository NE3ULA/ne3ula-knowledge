<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800"><rect width="1200" height="1800" fill="#FBF9F5"/><text x="110" y="120" fill="#D6A43B" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="4">SPARK</text><line x1="110" y1="155" x2="1090" y2="155" stroke="#DDD7E4" stroke-width="2" opacity="1"/><circle cx="1040" cy="108" r="9.6" fill="none" stroke="#9B5CFF" stroke-width="1.5" opacity="1"/><circle cx="1040" cy="108" r="18.56" fill="none" stroke="#9B5CFF" stroke-width="1" opacity="0.55"/><circle cx="1040" cy="108" r="28.16" fill="none" stroke="#9B5CFF" stroke-width="1" opacity="0.28"/><circle cx="1056" cy="99.03999999999999" r="1.28" fill="#9B5CFF" stroke="none" stroke-width="0" opacity="1"/><circle cx="1016.96" cy="120.16" r="0.96" fill="#9B5CFF" stroke="none" stroke-width="0" opacity="1"/>
   <text x="110" y="265" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0">THE PART THAT REMEMBERS</text>
   <text x="110" y="355" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Before the plan is built, you notice something.</text>
   <text x="110" y="405" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">A phrase stays with you. A piece of music changes the shape of the room.</text>
   <text x="110" y="455" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">An image returns after you thought it was gone.</text>
   <text x="110" y="530" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">These moments are not instructions. They are signals—small openings that</text>
   <text x="110" y="580" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">reveal where attention, energy, and identity are already beginning to move.</text>
   <rect x="110" y="710" width="980" height="300" rx="16" fill="#FFFFFF" stroke="#D6A43B" stroke-width="2"/>
   <path d="M110 710 H300" stroke="#9B5CFF" stroke-width="8"/>
   <text x="165" y="795" fill="#D6A43B" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" text-anchor="start" letter-spacing="0">“</text><text x="225" y="805" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">You do not need to name your destiny.</text><text x="225" y="858" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">You need to notice what came alive.”</text>
   <text x="225" y="930" fill="#81788E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="3">— E3 FIELD NOTE</text><circle cx="995" cy="920" r="13.5" fill="none" stroke="#9B5CFF" stroke-width="1.5" opacity="1"/><circle cx="995" cy="920" r="26.1" fill="none" stroke="#9B5CFF" stroke-width="1" opacity="0.55"/><circle cx="995" cy="920" r="39.6" fill="none" stroke="#9B5CFF" stroke-width="1" opacity="0.28"/><circle cx="1017.5" cy="907.4" r="1.8" fill="#9B5CFF" stroke="none" stroke-width="0" opacity="1"/><circle cx="962.6" cy="937.1" r="1.35" fill="#9B5CFF" stroke="none" stroke-width="0" opacity="1"/>
   <text x="110" y="1145" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">NOTICE BEFORE YOU EXPLAIN</text><text x="110" y="1210" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Pause before converting the signal into a conclusion. Let attention gather</text><text x="110" y="1260" fill="#17131F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">evidence. The first practice is not certainty; it is honest observation.</text>
   <text x="110" y="1660" fill="#81788E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">WE ARE ALCHEMY  |  E3 FIELD GUIDE</text><text x="1090" y="1660" fill="#81788E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="0">13</text></svg>