<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><rect width="1600" height="2000" fill="#0A0812"/><rect x="90" y="90" width="1420" height="1820" rx="42" fill="#120E1D" stroke="#3E3255" stroke-width="3"/><text x="160" y="210" fill="#9B5CFF" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="6">E3 MODEL</text><text x="160" y="315" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="700" text-anchor="start" letter-spacing="0">THE LIFEMODS CYCLE</text><text x="160" y="385" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" text-anchor="start" letter-spacing="0">Modify conditions, observe reality, and evolve the design.</text><line x1="160" y1="435" x2="1440" y2="435" stroke="#3E3255" stroke-width="3"/><rect x="160" y="500" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="500" width="16" height="190" rx="8" fill="#9B5CFF"/><text x="220" y="555" fill="#9B5CFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">01</text><text x="310" y="558" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">DETECT</text><text x="310" y="605" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Notice friction or opportunity</text><rect x="160" y="712" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="712" width="16" height="190" rx="8" fill="#25D9D0"/><text x="220" y="767" fill="#25D9D0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">02</text><text x="310" y="770" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">CAPTURE</text><text x="310" y="817" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Name the pattern and context</text><rect x="160" y="924" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="924" width="16" height="190" rx="8" fill="#F3B63F"/><text x="220" y="979" fill="#F3B63F" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">03</text><text x="310" y="982" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">EVALUATE</text><text x="310" y="1029" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Assess function, impact, effort, and alignment</text><rect x="160" y="1136" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="1136" width="16" height="190" rx="8" fill="#F26B9B"/><text x="220" y="1191" fill="#F26B9B" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">04</text><text x="310" y="1194" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">EXECUTE</text><text x="310" y="1241" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Take the next visible action</text><rect x="160" y="1348" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="1348" width="16" height="190" rx="8" fill="#A9E34B"/><text x="220" y="1403" fill="#A9E34B" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">05</text><text x="310" y="1406" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">REVIEW</text><text x="310" y="1453" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Observe what reality changed or revealed</text><rect x="160" y="1560" width="1280" height="190" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="1560" width="16" height="190" rx="8" fill="#63A8FF"/><text x="220" y="1615" fill="#63A8FF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">06</text><text x="310" y="1618" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">EVOLVE</text><text x="310" y="1665" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Keep, refine, expand, or release</text><line x1="160" y1="1800" x2="1440" y2="1800" stroke="#3E3255" stroke-width="3"/><text x="800" y="1860" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="0">SYSTEMS SERVE LIFE. LIFE DOES NOT SERVE THE SYSTEM.</text></svg>