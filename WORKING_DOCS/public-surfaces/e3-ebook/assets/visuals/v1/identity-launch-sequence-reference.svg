 y="1459.6666666666667" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Let participation change you</text><rect x="160" y="1497.1111111111113" width="1280" height="120.44444444444444" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="1497.1111111111113" width="16" height="120.44444444444444" rx="8" fill="#D9C8FF"/><text x="220" y="1552.1111111111113" fill="#D9C8FF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">08</text><text x="310" y="1555.1111111111113" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">LIVE YOUR LEGEND</text><text x="310" y="1602.1111111111113" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Embody the authored story</text><rect x="160" y="1639.5555555555557" width="1280" height="120.44444444444444" rx="24" fill="#171222" stroke="#3E3255" stroke-width="3"/><rect x="160" y="1639.5555555555557" width="16" height="120.44444444444444" rx="8" fill="#7FE0B8"/><text x="220" y="1694.5555555555557" fill="#7FE0B8" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">09</text><text x="310" y="1697.5555555555557" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">FORGE THE MYTH</text><text x="310" y="1744.5555555555557" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Make meaning from lived experience</text><line x1="160" y1="1800" x2="1440" y2="1800" stroke="#3E3255" stroke-width="3"/><text x="800" y="1860" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="0">FORGE THE 