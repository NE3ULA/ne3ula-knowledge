<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000"><rect width="1600" height="2000" fill="#0A0812"/><rect x="90" y="90" width="1420" height="1820" rx="42" fill="#120E1D" stroke="#3E3255" stroke-width="3"/><text x="160" y="210" fill="#9B5CFF" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="6">E3 MODEL</text><text x="160" y="315" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="700" text-anchor="start" letter-spacing="0">THE IDENTITY STACK</text><text x="160" y="385" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="400" text-anchor="start" letter-spacing="0">A living structure for interpreting identity without reducing it to a type.</text><line x1="160" y1="435" x2="1440" y2="435" stroke="#3E3255" stroke-width="3"/><rect x="210" y="520" width="1180" height="150" rx="24" fill="#171222" stroke="#9B5CFF" stroke-width="4"/><text x="800" y="583" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">IDENTITY CORE</text><text x="800" y="630" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">Authored orientation · values · commitments</text><rect x="255" y="725" width="1090" height="150" rx="24" fill="#171222" stroke="#25D9D0" stroke-width="4"/><text x="800" y="788" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">DECLARED IDENTITY</text><text x="800" y="835" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">Who you consciously choose to become</text><rect x="300" y="930" width="1000" height="150" rx="24" fill="#171222" stroke="#F3B63F" stroke-width="4"/><text x="800" y="993" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">LIVED EVIDENCE</text><text x="800" y="1040" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">Repeated behavior and embodied expression</text><rect x="345" y="1135" width="910" height="150" rx="24" fill="#171222" stroke="#F26B9B" stroke-width="4"/><text x="800" y="1198" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">PATTERNS + SIGNALS</text><text x="800" y="1245" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">What repeats, clusters, reinforces, or contradicts</text><rect x="390" y="1340" width="820" height="150" rx="24" fill="#171222" stroke="#A9E34B" stroke-width="4"/><text x="800" y="1403" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">STATES + ROLES</text><text x="800" y="1450" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">Present conditions and situational identities</text><rect x="435" y="1545" width="730" height="150" rx="24" fill="#171222" stroke="#63A8FF" stroke-width="4"/><text x="800" y="1608" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="0">DRIFT + REVISION</text><text x="800" y="1655" fill="#B7ADCA" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="middle" letter-spacing="0">Recalibrate without converting drift into destiny</text><text x="800" y="1845" fill="#F6F1FF" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="0">STRUCTURED ENOUGH TO GUIDE. ALIVE ENOUGH TO REVISE.</text></svg>